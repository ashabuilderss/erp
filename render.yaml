services:
  - type: web
    name: dashboard-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci && NODE_OPTIONS="--max-old-space-size=4096" npm run build --workspace=apps/api
    startCommand: npm run prisma:migrate:deploy --workspace=apps/api && npm run start:prod --workspace=apps/api
    initialDeployHook: npm run prisma:seed --workspace=apps/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=4096"
      # Database — Supabase (PostgreSQL) connection string.
      # Create a project at https://supabase.com, then copy the
      # connection string from Project Settings → Database → Connection string.
      - key: DATABASE_URL
        sync: false
      # Redis — Upstash (managed Redis with TLS).
      # Create a database at https://upstash.com, then copy the
      # Redis URL (rediss://...) from the Upstash dashboard.
      - key: REDIS_URL
        sync: false
      # Configure the following values in Render before the first deploy.
      # They intentionally never appear in source control.
      - key: AUTH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: USE_LEGACY_RBAC
        value: "false"
      - key: AUTH_LOGIN_THROTTLE_LIMIT
        value: "30"
      - key: THROTTLE_LIMIT
        value: "100"
      # One-time initial owner seed values. Remove the password after
      # successful sign-in and rotation.
      - key: SEED_COMPANY_NAME
        sync: false
      - key: SEED_COMPANY_SLUG
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
