services:
  - type: web
    name: dashboard-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build --workspace=apps/api
    startCommand: npm run prisma:migrate:deploy --workspace=apps/api && npm run start:prod --workspace=apps/api
    initialDeployHook: npm run prisma:seed --workspace=apps/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dashboard-postgres
          property: connectionString
      # Configure the following values in Render before the first deploy.
      # They intentionally never appear in source control.
      - key: AUTH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: USE_LEGACY_RBAC
        value: "false"
      - key: AUTH_LOGIN_THROTTLE_LIMIT
        value: "30"
      - key: THROTTLE_LIMIT
        value: "100"
      # One-time initial owner seed values. Remove the password after
      # successful sign-in and rotation.
      - key: SEED_COMPANY_NAME
        sync: false
      - key: SEED_COMPANY_SLUG
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

databases:
  - name: dashboard-postgres
    region: oregon
    plan: free
