apiVersion: apps/v1
kind: Deployment
metadata:
    name: postgres
    namespace: dashboard
    labels:
        com.docker.compose.project: dashboard
        com.docker.compose.service: postgres
spec:
    replicas: 1
    selector:
        matchLabels:
            com.docker.compose.project: dashboard
            com.docker.compose.service: postgres
    strategy:
        type: Recreate
    template:
        metadata:
            labels:
                com.docker.compose.project: dashboard
                com.docker.compose.service: postgres
