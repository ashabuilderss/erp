services:
  test-postgres:
    image: postgres:16-alpine
    profiles: ["test", "e2e"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: dashboard_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d dashboard_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  test-redis:
    image: redis:7-alpine
    profiles: ["test", "e2e"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  api-test:
    profiles: ["test"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    command: ["sh", "-c", "set -e; npx prisma db push --force-reset --accept-data-loss && npm test -- --runInBand"]
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@test-postgres:5432/dashboard_test
      AUTH_SECRET: test-auth-secret-at-least-32-characters
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      FRONTEND_URL: http://localhost:3000
      REDIS_URL: redis://test-redis:6379
    depends_on:
      test-postgres:
        condition: service_healthy
      test-redis:
        condition: service_healthy

  api-e2e:
    profiles: ["e2e"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    command:
      [
        "sh",
        "-c",
        "set -e; npx prisma db push --force-reset --accept-data-loss && NODE_OPTIONS='--max-old-space-size=8192' npm run test:e2e",
      ]
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@test-postgres:5432/dashboard_test
      AUTH_SECRET: test-auth-secret-at-least-32-characters
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      FRONTEND_URL: http://localhost:3000
      REDIS_URL: redis://test-redis:6379
    depends_on:
      test-postgres:
        condition: service_healthy
      test-redis:
        condition: service_healthy

  web-test:
    profiles: ["web-build"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "build"]
    environment:
      NODE_ENV: test
      AUTH_SECRET: test-auth-secret-at-least-32-characters
      AUTH_URL: http://web-test:3000
      API_URL: http://api:4000
