services:
  postgres:
    image: postgres:16-alpine
    container_name: dashboard-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER before running docker compose}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before running docker compose}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB before running docker compose}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: dashboard-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD before running docker compose}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: dashboard-api
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL before running docker compose}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET before running docker compose}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY before running docker compose}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL before running docker compose}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD before running docker compose}@redis:6379
      PORT: 4000
      USE_LEGACY_RBAC: ${USE_LEGACY_RBAC:-true}
      AUTH_LOGIN_THROTTLE_LIMIT: ${AUTH_LOGIN_THROTTLE_LIMIT:-30}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      NODE_OPTIONS: "--max-old-space-size=1536"
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); http.get('http://localhost:4000/api/health', (res) => { if (res.statusCode === 200) { process.exit(0); } else { process.exit(1); } }).on('error', () => process.exit(1));\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G

  api-migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: dashboard-api-migrate
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL before running docker compose}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET before running docker compose}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY before running docker compose}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL before running docker compose}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api-seed:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: dashboard-api-seed
    command: ["npx", "tsx", "prisma/seed.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL before running docker compose}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET before running docker compose}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY before running docker compose}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL before running docker compose}
      SEED_COMPANY_NAME: ${SEED_COMPANY_NAME:-Default Company}
      SEED_COMPANY_SLUG: ${SEED_COMPANY_SLUG:-default-company}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?Set SEED_ADMIN_EMAIL before running docker compose}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD before running docker compose}
    depends_on:
      api-migrate:
        condition: service_completed_successfully
    restart: "no"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: dashboard-web
    environment:
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET before running docker compose}
      AUTH_URL: ${AUTH_URL:?Set AUTH_URL before running docker compose}
      NEXTAUTH_URL: ${AUTH_URL:?Set AUTH_URL before running docker compose}
      AUTH_TRUST_HOST: "true"
      API_URL: ${WEB_API_URL:-http://api:4000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

volumes:
  postgres_data:
  uploads_data:
