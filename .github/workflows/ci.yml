name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: API Unit Tests (Jest, mocked Prisma)
  # ──────────────────────────────────────────────────────────
  api-unit-tests:
    name: API Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dashboard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d dashboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: apps/api
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Run unit tests
        working-directory: apps/api
        run: npm test -- --runInBand
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/dashboard_test
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: ci-test-auth-secret-at-least-32-characters-long
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          FRONTEND_URL: http://localhost:3000

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-unit-coverage
          path: apps/api/coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────
  # Job 2: API E2E Tests (Jest + Supertest, real DB)
  # ──────────────────────────────────────────────────────────
  api-e2e-tests:
    name: API E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dashboard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d dashboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: apps/api
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Run migrations
        working-directory: apps/api
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/dashboard_test

      - name: Run E2E tests
        working-directory: apps/api
        run: npm run test:e2e
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/dashboard_test
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: ci-test-auth-secret-at-least-32-characters-long
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          FRONTEND_URL: http://localhost:3000

  # ──────────────────────────────────────────────────────────
  # Job 3: Web E2E Tests (Playwright, real API + DB)
  # ──────────────────────────────────────────────────────────
  web-e2e-tests:
    name: Web E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dashboard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d dashboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Run migrations
        working-directory: apps/api
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/dashboard_test

      - name: Seed database
        working-directory: apps/api
        run: npx ts-node scripts/seed-ci.ts || echo "Seed script not found, skipping"
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/dashboard_test
          AUTH_SECRET: ci-test-auth-secret-at-least-32-characters-long
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

      - name: Install Web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build Web
        working-directory: apps/web
        run: npm run build
        env:
          API_URL: http://127.0.0.1:4000
          NEXTAUTH_URL: http://localhost:3000
          AUTH_SECRET: ci-test-auth-secret-at-least-32-characters-long
          AUTH_URL: http://localhost:3000

      - name: Start API server
        working-directory: apps/api
        run: npm run start:dev &
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/dashboard_test
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: ci-test-auth-secret-at-least-32-characters-long
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          FRONTEND_URL: http://localhost:3000
          PORT: "4000"

      - name: Wait for API server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/api/health > /dev/null 2>&1; then
              echo "API server is ready"
              exit 0
            fi
            echo "Waiting for API server... ($i/60)"
            sleep 2
          done
          echo "API server failed to start"
          exit 1

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install chromium --with-deps

      - name: Run Web E2E tests
        working-directory: apps/web
        run: npx playwright test --reporter=list
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          WEB_E2E_BASE_URL: http://localhost:3000
          API_URL: http://127.0.0.1:4000
          NEXTAUTH_URL: http://localhost:3000
          AUTH_SECRET: ci-test-auth-secret-at-least-32-characters-long
          AUTH_URL: http://localhost:3000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
